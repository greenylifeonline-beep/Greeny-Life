name: c5-week
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
  pull_request:
  push:
    paths:
      - scripts/ai-os/raios_c5_week.py
      - .github/workflows/c5-week.yml
      - gym/**
      - .ai-os/council/WEEK-CASE-004.md
jobs:
  sleepless-practice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: C5 week auto slot
        run: python3 scripts/ai-os/raios_c5_week.py --auto
      - name: upload day receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c5-week-receipt
          path: .ai-os/receipts/c5-week/
      - name: notice
        run: |
          echo "Schedule on this workflow fires from the repository default branch (main)."
          echo "This is a pulse, not a second WAL, and does not set GL005_PROVEN."
