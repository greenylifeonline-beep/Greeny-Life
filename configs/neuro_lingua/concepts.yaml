# Canonical Concept Registry — meaning is independent of language.
# Lower scopes may customize realization; they may not silently redefine
# canonical_meaning. Collision detection lives in the loader.

concepts:
  - concept_id: action.resolve
    canonical_meaning: "Bring an open matter to a completed, handled state."
    aliases:
      en: [resolve, finish, complete, close out, take care of]
      ar-EG: [خلصه, خلص, عالج, اقفله]
      ar-GULF: [خلصه, خلص, عالج]
      nb-NO: [løse, fikse, gjøre ferdig]
      sv-SE: [lösa, åtgärda, göra klart]
      da-DK: [løse, fikse, gøre færdig]
    realizations:
      en: "resolve the matter"
      ar-EG: "خلّص الموضوع"
      ar-GULF: "خلّص الموضوع"
      nb-NO: "løs saken"
      sv-SE: "lös saken"
      da-DK: "løs sagen"
    domains: [software, operations, general]

  - concept_id: deadline.today
    canonical_meaning: "The required completion time is the current local calendar day."
    aliases:
      en: [today, by today, this day]
      ar-EG: [اليوم, النهارده, النهاردة]
      ar-GULF: [اليوم, الحين]
      nb-NO: [i dag, idag]
      sv-SE: [i dag, idag]
      da-DK: [i dag, idag]
    realizations:
      en: "today"
      ar-EG: "اليوم"
      ar-GULF: "اليوم"
      nb-NO: "i dag"
      sv-SE: "i dag"
      da-DK: "i dag"
    domains: [general, operations]

  - concept_id: pragmatics.politeness_softener
    canonical_meaning: "A politeness or deference marker; not a logical precondition."
    aliases:
      en: [please, if you don't mind, if it's no trouble]
      ar-EG: [إذا ما عليك أمر, لو سمحت, من فضلك, لو تكرمت]
      ar-GULF: [إذا ما عليك أمر, لو سمحت, تكرم]
      nb-NO: [vær så snill, om du har mulighet]
      sv-SE: [var snäll, om det går]
      da-DK: [vær venlig, hvis det er muligt]
    realizations:
      en: "please"
      ar-EG: "لو سمحت"
      ar-GULF: "لو سمحت"
      nb-NO: "vær så snill"
      sv-SE: "var snäll"
      da-DK: "vær venlig"
    domains: [general]
    flags:
      not_logical_condition: true

  - concept_id: system.regression
    canonical_meaning: "A system, environment, or pipeline is heading toward an unstable or failing state."
    aliases:
      en: [regression, system break, going to break, falling over]
      ar-EG: [الدنيا هتبوظ, هتبوظ, هيبوظ, الدنيا وقعت, هيقع]
      ar-GULF: [بيخرب, بيطبح]
      nb-NO: [systemet knekker, går i stykker]
      sv-SE: [systemet kraschar, går sönder]
      da-DK: [systemet knækker, går i stykker]
    realizations:
      en: "the system is going to break"
      ar-EG: "الدنيا هتبوظ"
      ar-GULF: "بيخرب النظام"
      nb-NO: "systemet kommer til å knekke"
      sv-SE: "systemet kommer att gå sönder"
      da-DK: "systemet kommer til at knække"
    domains: [software]
    contextual_only: true

  - concept_id: software.migration
    canonical_meaning: "A software schema, data, or environment migration process."
    aliases:
