schema_version: 1

concepts:

  - concept_id: raios.knowledge.canonical_promotion
    layer: GLOBAL
    version: 1
    provenance: raios-core
    canonical_semantics: knowledge_state_transition
    canonical:
      type: knowledge_state_transition
      from: [DISCOVERED, VALIDATED]
      to: [CANONICAL]
    realizations:
      en:
        preferred: "canonical promotion"
      ar:
        formal: "الترقية إلى المعرفة المعتمدة"
        technical: "Canonical Promotion"
        ar-EG: "اعتماد المعرفة نهائياً داخل النظام"
      nb-NO:
        preferred: "kanonisk kunnskapsforfremmelse"
      sv-SE:
        preferred: "kanonisk kunskapspromovering"
      da-DK:
        preferred: "kanonisk videnspromovering"

  - concept_id: raios.system.regression
    layer: GLOBAL
    version: 1
    provenance: raios-core
    canonical_semantics: "A previously working capability becomes incorrect after a change."
    canonical:
      type: software_quality_concept
      meaning: "A previously working capability becomes incorrect after a change."
    realizations:
      en:
        preferred: "regression"
      ar:
        formal: "تراجع وظيفي بعد التغيير"
        ar-EG:
          aliases:
            - "الدنيا هتبوظ"
            - "حاجة تتكسر"
            - "المشروع يبوظ"
            - "متبوظش حاجة"
      nb-NO:
        preferred: "regresjon"
      sv-SE:
        preferred: "regression"
      da-DK:
        preferred: "regression"

  - concept_id: raios.pragmatics.politeness_not_condition
    layer: GLOBAL
    version: 1
    provenance: nl0
    canonical_semantics: "A politeness formula must not be interpreted as a logical condition."
    aliases:
      - "إذا ما عليك أمر"
      - "اذا ما عليك امر"
    realizations:
      ar-GULF:
        preferred: "إذا ما عليك أمر"
      ar-EG:
        preferred: "لو سمحت"
      en:
        preferred: "please"
      nb-NO:
        preferred: "vennligst"
      sv-SE:
        preferred: "snälla"
      da-DK:
        preferred: "venligst"

  - concept_id: raios.action.resolve
    layer: GLOBAL
    version: 1
    provenance: nl0
    canonical_semantics: "Resolve or complete the outstanding matter."
    aliases:
      - "خلصه"
      - "خلصلي"
      - "شوف لنا الموضوع"
    realizations:
      ar-EG:
        preferred: "خلصلي الموضوع"
      ar-GULF:
        preferred: "شوف لنا الموضوع"
      en:
        preferred: "resolve"
      nb-NO:
        preferred: "løse"
      sv-SE:
        preferred: "lösa"
      da-DK:
        preferred: "løse"
