# ========================================================================
# تكوين Greeny-Life EOS Brain v5.0 - الإصدار المحسّن
# ========================================================================

# تعطيل ArchGuard مؤقتاً لتجنب انتهاء المهلة (حتى يتم تثبيته بشكل صحيح)
archguard:
  enabled: false
  config: ".archguard.yml"

# تعطيل SonarQube مؤقتاً (لأن SONAR_TOKEN غير مضبوط)
sonarqube:
  enabled: false
  url: "http://localhost:9000"
  token: ""

# تعطيل govern-kit مؤقتاً (يتطلب تهيئة إضافية)
govern:
  enabled: false
  trust_threshold: 0.80
  window_size: 10

# إعدادات الأمان (Bandit متاح ويعمل)
security:
  tools: ["bandit"]
  severity_threshold: "MEDIUM"

# إعدادات الأداء (زيادة المهلة قليلاً)
performance:
  test_dir: "tests/performance"
  vus: 10
  duration: "15s"

# إعدادات التوثيق (تفعيل Claude عبر npx)
documentation:
  auto_fix: true
  output_dir: "docs"
  ignore_patterns: [".*test.*", ".*migrations.*"]

# إعدادات الدماغ (زيادة عدد الملفات للتحليل العميق)
brain:
  max_files_to_deep_scan: 300
  enable_ai_summary: true
  backup_before_fix: true
  knowledge_base_path: "intelligence/knowledge_base"

# التطور الذاتي (تعطيل PR التلقائي حتى يتم توثيق gh)
evolution:
  auto_propose_updates: true
  require_approval: true
  pr_branch_prefix: "ai-evolution-"
  test_before_merge: true

# التنظيف التلقائي
cleanup:
  keep_last_n_logs: 5
  keep_last_n_alerts: 5
  keep_last_n_reports: 5
  archive_duplicates: true
  auto_merge_conflicts: true
